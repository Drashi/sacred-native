# Layout check, build and unit tests on Linux ARM64 and macOS Apple Silicon, and the release bundles with their
# checks (committed files only, no paths of the build machine in any shipped file). The game itself is not part of
# CI: tests that read a Sacred Gold installation are only registered when SACRED_ASSETS is set.
# A pushed tag v* (e.g. v0.1.0) also publishes both bundles as a GitHub release once every job has passed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: clang-format 19.1.7
        run: |
          python3 -m venv build/fmt-venv
          build/fmt-venv/bin/pip install --quiet clang-format==19.1.7
      - name: Check the layout
        run: bash tools/check_format.sh

  linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake pkg-config python3-venv curl \
            xz-utils libfreetype-dev zlib1g-dev libgl-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxxf86vm-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev wayland-protocols libpulse-dev libasound2-dev \
            libpipewire-0.3-dev libegl-mesa0 libgl1-mesa-dri
      - name: Private dependencies (SDL2, FreeType, LGPL FFmpeg) and the Python venv
        run: |
          bash tools/build_linux_deps.sh
          bash tools/bootstrap.sh --venv --ffmpeg
      - name: Build and test the runtime
        run: |
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci --parallel "$(nproc)"
          ctest --test-dir build/ci --output-on-failure
      - name: Bundle (with its file and path checks)
        run: bash tools/dist/make_bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sacred-native-linux-arm64
          path: dist/sacred-native-linux-arm64.tar.gz

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Private dependencies (pkg-config, SDL2, FreeType, LGPL FFmpeg) and the Python venv
        run: |
          bash tools/build_macos_deps.sh
          bash tools/bootstrap.sh --venv --ffmpeg
      - name: Build and test the runtime
        run: |
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci --parallel "$(sysctl -n hw.ncpu)"
          ctest --test-dir build/ci --output-on-failure
      - name: Bundle (with its file and path checks)
        run: bash tools/dist/make_bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sacred-native-macos-arm64
          path: dist/sacred-native-macos-arm64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum sacred-native-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes: the annotated tag's message (the summary of the release, written by hand), then the merged
          # pull requests since the previous release, grouped by .github/release.yml.
          summary=""
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
              summary="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .message)"
          fi
          # A tag with a suffix (v0.2.0-rc.1) is published as a pre-release.
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/sacred-native-*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Sacred Native $GITHUB_REF_NAME" \
            --notes "$summary" --generate-notes "${prerelease[@]}"
